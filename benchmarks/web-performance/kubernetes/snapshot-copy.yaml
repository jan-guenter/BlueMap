apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bluemap-perf-snapshot
  namespace: minecraft
  labels:
    app.kubernetes.io/name: bluemap-perf-snapshot
    app.kubernetes.io/part-of: bluemap-web-performance
    bluemap.guenter.cloud/experiment-id: immutable-snapshot
spec:
  storageClassName: longhorn-static
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bluemap-perf-snapshot-copy
  namespace: minecraft
  labels:
    app.kubernetes.io/name: bluemap-perf-snapshot-copy
    app.kubernetes.io/part-of: bluemap-web-performance
    bluemap.guenter.cloud/experiment-id: immutable-snapshot
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bluemap-perf-snapshot-copy
        app.kubernetes.io/part-of: bluemap-web-performance
        bluemap.guenter.cloud/experiment-id: immutable-snapshot
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: contabo1
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: python:3.14-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/bluemap-snapshot/copy_snapshot.py
            - /source/bluemap/web
            - /snapshot
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /snapshot
            - name: tool
              mountPath: /opt/bluemap-snapshot
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: minecraft-data
            readOnly: true
        - name: destination
          persistentVolumeClaim:
            claimName: bluemap-perf-snapshot
        - name: tool
          configMap:
            name: bluemap-perf-snapshot-tool
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
