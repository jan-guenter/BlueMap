# Apply after java-optimized-postgresql-values.yaml for the three-replica case.
fullnameOverride: bluemap-perf-java-new-postgresql-r3

replicaCount: 3

podLabels:
  bluemap.guenter.cloud/experiment-id: java-new-postgresql-r3

deploymentLabels:
  bluemap.guenter.cloud/experiment-id: java-new-postgresql-r3

storage:
  sql:
    maxConnections: 4

# Three candidates must fit concurrently on the isolated web node. CPU limits
# remain one core per replica; lower requests affect scheduling only.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
