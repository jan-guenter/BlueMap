global
    user haproxy
    group haproxy
    maxconn 65535
    stats socket /run/haproxy/bluemap-stats.sock user loadgen group loadgen mode 0660 level user

defaults
    mode tcp
    timeout connect 10s
    timeout client 15m
    timeout server 15m
    retries 0
    no option redispatch

frontend bluemap_benchmark
    bind 127.0.0.1:18080
    default_backend bluemap_ssh_lanes

backend bluemap_ssh_lanes
    balance static-rr
    retries 0
    no option redispatch
    server lane_1 127.0.0.1:18081
    server lane_2 127.0.0.1:18082
    server lane_3 127.0.0.1:18083
    server lane_4 127.0.0.1:18084
    server lane_5 127.0.0.1:18085
    server lane_6 127.0.0.1:18086
    server lane_7 127.0.0.1:18087
    server lane_8 127.0.0.1:18088
