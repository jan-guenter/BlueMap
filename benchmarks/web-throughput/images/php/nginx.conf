user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile off;
    tcp_nopush off;
    gzip off;
    etag off;

    # Do not let nginx cache, buffer, compress, or otherwise transform the
    # exact upstream PHP handler's response body.
    proxy_cache off;
    fastcgi_cache off;
    fastcgi_buffering off;
    fastcgi_request_buffering off;

    server {
        listen 127.0.0.1:8100;
        root /srv/bluemap;

        location = /healthz {
            return 204;
        }

        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/bluemap/sql.php;
            fastcgi_param SCRIPT_NAME /sql.php;
            fastcgi_param PHP_SELF /sql.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
