{{- if .Values.phpFpm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bluemap-web.phpFullname" . }}
  labels:
    {{- include "bluemap-web.phpLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.phpFpm.replicaCount }}
  selector:
    matchLabels:
      {{- include "bluemap-web.phpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/php-nginx-configmap.yaml") . | sha256sum }}
        checksum/sql-secret: {{ include (print $.Template.BasePath "/sql-secret.yaml") . | sha256sum }}
        {{- with .Values.phpFpm.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "bluemap-web.phpSelectorLabels" . | nindent 8 }}
        {{- with .Values.phpFpm.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "bluemap-web.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.phpFpm.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: php-fpm
          image: "{{ .Values.phpFpm.image.repository }}:{{ .Values.phpFpm.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.phpFpm.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.phpFpm.phpSecurityContext | nindent 12 }}
          env:
            - name: BLUEMAP_SQL_PDO_DRIVER
              value: {{ include "bluemap-web.sqlPdoDriver" . | quote }}
            - name: BLUEMAP_SQL_HOST
              value: {{ .Values.storage.sql.host | quote }}
            - name: BLUEMAP_SQL_PORT
              value: {{ .Values.storage.sql.port | quote }}
            - name: BLUEMAP_SQL_DATABASE
              value: {{ .Values.storage.sql.database | quote }}
            - name: BLUEMAP_SQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "bluemap-web.sqlCredentialsSecretName" . }}
                  key: {{ .Values.storage.sql.credentials.usernameKey }}
            - name: BLUEMAP_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bluemap-web.sqlCredentialsSecretName" . }}
                  key: {{ .Values.storage.sql.credentials.passwordKey }}
          resources:
            {{- toYaml .Values.phpFpm.resources | nindent 12 }}
          volumeMounts:
            - name: php-tmp
              mountPath: /tmp
            - name: php-run
              mountPath: /usr/local/var/run
        - name: nginx
          image: "{{ .Values.phpFpm.nginx.image.repository }}:{{ .Values.phpFpm.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.phpFpm.nginx.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.phpFpm.nginxSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.phpFpm.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.phpFpm.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.phpFpm.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "bluemap-web.phpFullname" . }}-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: php-run
          emptyDir: {}
        - name: php-tmp
          emptyDir: {}
      {{- with .Values.phpFpm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phpFpm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phpFpm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.phpFpm.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
