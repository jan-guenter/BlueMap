{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bluemap-web.fullname" . }}
  labels:
    {{- include "bluemap-web.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.phpFpm.enabled }}
          - path: {{ $.Values.phpFpm.ingress.path }}
            pathType: {{ $.Values.phpFpm.ingress.pathType }}
            backend:
              service:
                name: {{ include "bluemap-web.phpFullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "bluemap-web.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
