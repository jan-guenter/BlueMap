{{- if .Values.autoscaling.enabled }}
{{- include "bluemap-web.validate" . }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bluemap-web.fullname" . }}
  labels:
    {{- include "bluemap-web.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bluemap-web.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.utilizationMetricName | quote }}
        target:
          type: AverageValue
          averageValue: {{ printf "%dm" (mul (int .Values.autoscaling.targetAverageConnectionUtilizationPercentage) 10) | quote }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
