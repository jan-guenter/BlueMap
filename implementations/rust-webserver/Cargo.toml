[package]
name = "bluemap-rust-webserver"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone BlueMap web UI and map-data server"

[dependencies]
axum = "0.8.4"
bytes = "1.10.1"
clap = { version = "4.5.40", features = ["derive"] }
http-body = "1.0.1"
httpdate = "1.0.3"
mime_guess = "2.0.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "postgres",
] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.8.23"
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
