name: Standalone Web

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      publish-chart:
        description: Publish the Helm chart to GHCR
        required: false
        type: boolean
        default: false
      chart-version:
        description: SemVer chart version used for a manual publication
        required: false
        type: string
        default: "0.1.0"

permissions:
  contents: read

jobs:
  build:
    name: Build web server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Test and build
        run: ./gradlew --configure-on-demand :webserver:spotlessCheck :webserver:test :webserver:release --stacktrace
      - name: Upload web server
        uses: actions/upload-artifact@v7
        with:
          name: bluemap-webserver
          path: build/release/*-webserver.jar
          if-no-files-found: error

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Download web server
        uses: actions/download-artifact@v8
        with:
          name: bluemap-webserver
          path: build/release
      - name: Check whether this is the latest release
        id: release
        shell: bash
        run: |
          is_stable=false
          is_latest=false
          current_tag="${GITHUB_REF#refs/tags/}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]] &&
             [[ "${current_tag}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            is_stable=true
            latest_tag="$(
              git tag --list |
                grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' |
                sort -V |
                tail -n 1
            )"
            [[ "${current_tag}" == "${latest_tag}" ]] && is_latest=true
          fi

          echo "is-stable=${is_stable}" >> "${GITHUB_OUTPUT}"
          echo "is-latest=${is_latest}" >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bluemap-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=ref,event=tag,enable=${{ steps.release.outputs.is-stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is-latest == 'true' }}
          labels: |
            org.opencontainers.image.title=BlueMap Web
            org.opencontainers.image.description=Standalone BlueMap web UI and storage server
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=bluemap-web
          cache-to: type=gha,mode=max,scope=bluemap-web
          provenance: mode=max
          sbom: true

  php-image:
    name: Build and publish PHP-FPM image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this is the latest release
        id: release
        shell: bash
        run: |
          is_stable=false
          is_latest=false
          current_tag="${GITHUB_REF#refs/tags/}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]] &&
             [[ "${current_tag}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            is_stable=true
            latest_tag="$(
              git tag --list |
                grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' |
                sort -V |
                tail -n 1
            )"
            [[ "${current_tag}" == "${latest_tag}" ]] && is_latest=true
          fi

          echo "is-stable=${is_stable}" >> "${GITHUB_OUTPUT}"
          echo "is-latest=${is_latest}" >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bluemap-web-php
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=ref,event=tag,enable=${{ steps.release.outputs.is-stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is-latest == 'true' }}
          labels: |
            org.opencontainers.image.title=BlueMap SQL PHP-FPM
            org.opencontainers.image.description=BlueMap SQL map-data endpoint for PHP-FPM
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=bluemap-web-php
          cache-to: type=gha,mode=max,scope=bluemap-web-php
          provenance: mode=max
          sbom: true

  chart:
    name: Validate and publish Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Determine chart version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.chart-version }}
          MANUAL_PUBLISH: ${{ inputs.publish-chart }}
        run: |
          publish=false
          app_version="${GITHUB_REF_NAME}"
          chart_version="0.1.0-dev.${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]] &&
             [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            patch="${BASH_REMATCH[4]:-0}"
            chart_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${patch}"
            publish=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" &&
                  "${MANUAL_PUBLISH}" == "true" ]]; then
            if [[ ! "${MANUAL_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::chart-version must be a valid SemVer version"
              exit 1
            fi
            chart_version="${MANUAL_VERSION}"
            publish=true
          fi

          {
            echo "chart-version=${chart_version}"
            echo "app-version=${app_version}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"
      - name: Lint chart
        run: helm lint charts/bluemap-web
      - name: Render chart
        run: |
          helm template test charts/bluemap-web --namespace bluemap
          helm template test charts/bluemap-web --namespace bluemap \
            --values charts/bluemap-web/ci/download-driver-values.yaml
          helm template test charts/bluemap-web --namespace bluemap \
            --values charts/bluemap-web/ci/configmap-driver-values.yaml
          helm template test charts/bluemap-web --namespace bluemap \
            --values charts/bluemap-web/ci/php-fpm-values.yaml
      - name: Package chart
        run: |
          helm package charts/bluemap-web \
            --destination build/charts \
            --version "${{ steps.version.outputs.chart-version }}" \
            --app-version "${{ steps.version.outputs.app-version }}"
      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.repository_owner }}" \
              --password-stdin
      - name: Publish chart
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push \
            "build/charts/bluemap-web-${{ steps.version.outputs.chart-version }}.tgz" \
            "oci://ghcr.io/${owner}/charts"
