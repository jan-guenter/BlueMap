name: Formal benchmark controller image

on:
  push:
    branches:
      - experiment/runpod-formal-harness
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Validate and publish controller
    runs-on: ubuntu-24.04
    outputs:
      benchmark-revision: ${{ steps.bundle.outputs.benchmark_revision }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out tracked controller bundle
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test durable controller contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          python benchmarks/web-performance/controller/test_packaging.py
          python -m unittest discover \
            -s benchmarks/web-performance/controller/tests \
            -p 'test_*.py'

      - name: Resolve and validate frozen benchmark revision
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          matrix=benchmarks/web-performance/controller/frozen/formal-inputs/matrix.json
          test -f "$matrix"
          benchmark_revision="$(jq -er '.benchmarkGitRevision' "$matrix")"
          [[ "$benchmark_revision" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$benchmark_revision^{commit}"

          bundle_revision="$GITHUB_SHA"
          mapfile -t trigger_diff < <(
            git diff-tree \
              --no-commit-id \
              --name-status \
              --no-renames \
              -r \
              "$GITHUB_SHA"
          )
          expected_bootstrap_diff=(
            $'M\t.github/workflows/formal-controller.yml'
          )
          bootstrap_commit=true
          if [[ "${#trigger_diff[@]}" -ne \
            "${#expected_bootstrap_diff[@]}" ]]; then
            bootstrap_commit=false
          else
            for index in "${!expected_bootstrap_diff[@]}"; do
              if [[ "${trigger_diff[$index]}" != \
                "${expected_bootstrap_diff[$index]}" ]]; then
                bootstrap_commit=false
                break
              fi
            done
          fi
          if [[ "$bootstrap_commit" == true ]]; then
            read -r -a trigger_commit < <(
              git rev-list --parents -n 1 "$GITHUB_SHA"
            )
            [[ "${#trigger_commit[@]}" -eq 2 ]] || {
              printf 'Workflow bootstrap commit must have exactly one parent\n' >&2
              exit 1
            }
            bundle_revision="${trigger_commit[1]}"
          fi

          read -r -a bundle_commit < <(
            git rev-list --parents -n 1 "$bundle_revision"
          )
          [[ "${#bundle_commit[@]}" -eq 2 ]] || {
            printf 'Bundle commit must have exactly one parent\n' >&2
            exit 1
          }
          [[ "${bundle_commit[1]}" == "$benchmark_revision" ]] || {
            printf 'Bundle commit must be a direct child of %s\n' \
              "$benchmark_revision" >&2
            exit 1
          }

          expected_bundle_diff=(
            $'A\tbenchmarks/web-performance/controller/frozen/controller-lock.json'
            $'A\tbenchmarks/web-performance/controller/frozen/formal-inputs/bundle-manifest.json'
            $'A\tbenchmarks/web-performance/controller/frozen/formal-inputs/matrix.json'
            $'A\tbenchmarks/web-performance/controller/frozen/formal-inputs/runtime-admission-identities.json'
            $'A\tbenchmarks/web-performance/controller/frozen/formal-inputs/schedule.json'
            $'A\tbenchmarks/web-performance/controller/frozen/manifest.json'
          )
          mapfile -t actual_bundle_diff < <(
            git diff-tree \
              --no-commit-id \
              --name-status \
              --no-renames \
              -r \
              "$bundle_revision"
          )
          [[ "${#actual_bundle_diff[@]}" -eq "${#expected_bundle_diff[@]}" ]] || {
            printf 'Bundle commit must add exactly the six frozen JSON files\n' >&2
            printf 'Observed diff:\n' >&2
            printf '  %s\n' "${actual_bundle_diff[@]}" >&2
            exit 1
          }
          for index in "${!expected_bundle_diff[@]}"; do
            [[ "${actual_bundle_diff[$index]}" == \
              "${expected_bundle_diff[$index]}" ]] || {
              printf 'Bundle commit contains an unexpected change at index %s\n' \
                "$index" >&2
              printf 'Expected: %s\nObserved: %s\n' \
                "${expected_bundle_diff[$index]}" \
                "${actual_bundle_diff[$index]}" >&2
              exit 1
            }
          done

          {
            printf 'benchmark_revision=%s\n' "$benchmark_revision"
            printf 'bundle_revision=%s\n' "$bundle_revision"
            printf 'created=%s\n' \
              "$(git show -s --format=%cI "$bundle_revision")"
          } >> "$GITHUB_OUTPUT"

          validation_root="$(mktemp -d)"
          git worktree add --detach "$validation_root" "$benchmark_revision"
          rm -rf "$validation_root/benchmarks/web-performance/controller/frozen"
          cp -a \
            benchmarks/web-performance/controller/frozen \
            "$validation_root/benchmarks/web-performance/controller/frozen"
          python benchmarks/web-performance/controller/validate_frozen_bundle.py \
            --repository "$validation_root" \
            --revision "$benchmark_revision"
          git worktree remove --force "$validation_root"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        shell: bash
        env:
          BENCHMARK_REVISION: ${{ steps.bundle.outputs.benchmark_revision }}
          BUNDLE_REVISION: ${{ steps.bundle.outputs.bundle_revision }}
        run: |
          set -Eeuo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/bluemap-perf-controller"
          {
            printf 'image=%s\n' "$image"
            printf 'tags<<EOF\n'
            printf '%s:formal-%s\n' "$image" "$BENCHMARK_REVISION"
            printf '%s:bundle-%s\n' "$image" "$BUNDLE_REVISION"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable controller image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: benchmarks/web-performance/controller/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}.git
            REVISION=${{ steps.bundle.outputs.benchmark_revision }}
            VERSION=formal-${{ steps.bundle.outputs.benchmark_revision }}
            CREATED=${{ steps.bundle.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.bundle.outputs.benchmark_revision }}
            io.bluemap.benchmark.bundle-revision=${{ steps.bundle.outputs.bundle_revision }}

      - name: Report immutable reference
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
